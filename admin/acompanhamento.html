<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Acompanhamento — RBCIP</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <img src="../assets/img/logo.png" alt="RBCIP — pesquisa e inovação" class="site-logo" onerror="this.style.display='none'" />
      <div class="header-text">
        <h1>Dashboard de Acompanhamento</h1>
      </div>
    </div>
  </header>

  <div id="area-login"></div>

  <main class="admin-wrap" id="area-dashboard" hidden>
    <div class="admin-top">
      <nav class="dash-nav">
        <a href="index.html">🗂️ Gestão</a>
        <a href="acompanhamento.html" class="ativo">📊 Acompanhamento</a>
      </nav>
      <div class="admin-user">
        <span id="quem"></span>
        <a class="link-formularios" href="../index.html">📝 Formulários</a>
        <button type="button" class="link-sair" id="btn-sair">Sair</button>
      </div>
    </div>

    <div class="filtros">
      <div class="campo">
        <label>Formulário</label>
        <select id="f-formulario">
          <option value="">Todos</option>
          <option value="pagamentos">Pagamento</option>
          <option value="reembolso">Reembolso</option>
          <option value="diarias-colaboradores">Diárias — Colaboradores</option>
          <option value="diarias-bolsistas">Diárias — Bolsistas</option>
        </select>
      </div>
      <div class="campo"><label>De</label><input type="date" id="f-de" /></div>
      <div class="campo"><label>Até</label><input type="date" id="f-ate" /></div>
    </div>

    <section class="stats" id="stats"></section>
    <section class="graficos" id="graficos"></section>
  </main>

  <footer class="site-footer">Sistema de Solicitações - RBCIP · v1.2</footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/acompanhamento.js"></script>
</body>
</html>
