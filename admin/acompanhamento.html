<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Acompanhamento — RBCIP</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>
<body>
  <header class="brand-bar brand-bar--centro">
    <img class="brand-bar__logo" src="../assets/img/logo.png"
         alt="RBCIP — pesquisa e inovação"
         onerror="this.style.display='none';
                  this.parentNode.querySelector('.brand-bar__texto').style.display='inline-flex';" />
    <span class="brand-bar__texto">RBCIP <small>pesquisa e inovação</small></span>
  </header>

  <div id="area-login"></div>

  <main class="admin-wrap" id="area-dashboard" hidden>
    <div class="page-head">
      <div>
        <h1 class="page-head__titulo">Dashboard de Acompanhamento</h1>
        <p class="page-head__sub">Sistema de Solicitações - RBCIP</p>
      </div>
      <div class="admin-user">
        <span id="quem"></span>
        <a class="link-formularios" href="../index.html" target="_blank" rel="noopener" title="Abre em uma nova aba">📝 Formulários</a>
        <button type="button" class="link-sair" id="btn-sair">Sair</button>
      </div>
    </div>

    <div class="admin-top">
      <nav class="dash-nav">
        <a href="index.html">🗂️ Gestão</a>
        <a href="acompanhamento.html" class="ativo">📊 Acompanhamento</a>
      </nav>
    </div>

    <div class="filtros">
      <div class="campo">
        <label>Formulário</label>
        <select id="f-formulario">
          <option value="">Todos</option>
          <option value="pagamentos">Pagamento</option>
          <option value="reembolso">Reembolso</option>
          <option value="diarias-colaboradores">Diárias — Colaboradores</option>
          <option value="diarias-bolsistas">Diárias — Bolsistas</option>
        </select>
      </div>
      <div class="campo"><label>De</label><input type="date" id="f-de" /></div>
      <div class="campo"><label>Até</label><input type="date" id="f-ate" /></div>
    </div>

    <section class="stats" id="stats"></section>
    <section class="graficos" id="graficos"></section>
  </main>

  <footer class="site-footer">Sistema de Solicitações - RBCIP · v1.3</footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/acompanhamento.js"></script>
</body>
</html>
