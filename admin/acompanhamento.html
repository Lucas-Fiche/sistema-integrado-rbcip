<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard de Acompanhamento — RBCIP</title>
  <link rel="icon" href="../assets/img/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../assets/img/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/acompanhamento.css" />
</head>
<body>
  <header class="brand-bar">
    <div class="brand-bar__inner">
      <img class="brand-bar__logo" src="../assets/img/logo.png"
           alt="RBCIP — pesquisa e inovação"
           onerror="this.style.display='none';
                    this.parentNode.querySelector('.brand-bar__texto').style.display='inline-flex';" />
      <span class="brand-bar__texto">RBCIP <small>pesquisa e inovação</small></span>
      <span class="brand-bar__divisor" aria-hidden="true"></span>
      <span class="brand-bar__sistema">Sistema de Solicitações</span>
    </div>
  </header>

  <div id="area-login"></div>

  <main class="admin-wrap" id="area-dashboard" hidden>
    <div class="page-head">
      <div>
        <h1 class="page-head__titulo">Dashboard de Acompanhamento</h1>
        <p class="page-head__sub">Sistema de Solicitações - RBCIP</p>
      </div>
      <div class="admin-user">
        <span id="quem"></span>
        <a class="link-formularios" href="../index.html" target="_blank" rel="noopener" title="Abre em uma nova aba">📝 Formulários</a>
        <button type="button" class="link-sair" id="btn-sair">Sair</button>
      </div>
    </div>

    <div class="admin-top">
      <nav class="dash-nav">
        <a href="index.html">🗂️ Gestão</a>
        <a href="acompanhamento.html" class="ativo">📊 Acompanhamento</a>
      </nav>
    </div>

    <!-- Filtros: uma linha acima de tudo; valem para todos os números da página -->
    <section class="ac-filtros" aria-label="Filtros">
      <div class="campo">
        <label for="f-periodo">Período</label>
        <select id="f-periodo">
          <option value="tudo">Todo o período</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="mes">Este mês</option>
          <option value="mes-anterior">Mês anterior</option>
          <option value="ano">Este ano</option>
          <option value="custom">Personalizado…</option>
        </select>
      </div>
      <div class="campo ac-campo-datas" hidden><label for="f-de">De</label><input type="date" id="f-de" /></div>
      <div class="campo ac-campo-datas" hidden><label for="f-ate">Até</label><input type="date" id="f-ate" /></div>
      <div class="campo">
        <label for="f-formulario">Formulário</label>
        <select id="f-formulario">
          <option value="">Todos</option>
          <option value="pagamentos">Pagamento</option>
          <option value="reembolso">Reembolso</option>
          <option value="diarias-colaboradores">Diárias para Colaboradores</option>
          <option value="diarias-bolsistas">Diárias para Bolsistas</option>
        </select>
      </div>
      <div class="campo">
        <label for="f-status">Situação</label>
        <select id="f-status">
          <option value="">Todas</option>
          <option value="abertas">Em aberto (não pagas nem rejeitadas)</option>
          <option value="pendente">Pendente</option>
          <option value="em_analise">Em análise</option>
          <option value="aprovado">Aprovado</option>
          <option value="pago">Pago</option>
          <option value="rejeitado">Rejeitado</option>
        </select>
      </div>
      <div class="campo">
        <label for="f-projeto">Projeto</label>
        <select id="f-projeto"><option value="">Todos</option></select>
      </div>
      <div class="campo ac-campo-busca">
        <label for="f-busca">Beneficiário</label>
        <input type="search" id="f-busca" placeholder="Nome ou CPF" autocomplete="off" />
      </div>
      <div class="ac-filtros__acoes">
        <button type="button" class="btn btn-secondary" id="f-limpar">Limpar filtros</button>
        <button type="button" class="btn btn-secondary" id="f-atualizar">↻ Atualizar</button>
      </div>
    </section>

    <div id="ac-conteudo">
      <p class="ac-recorte" id="ac-recorte" aria-live="polite"></p>
      <section class="ac-kpis" id="ac-kpis" aria-label="Indicadores"></section>
      <div id="ac-alertas"></div>
      <div class="ac-grade" id="ac-grade"></div>
    </div>
  </main>

  <footer class="site-footer">Sistema de Solicitações - RBCIP · v1.4</footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/acompanhamento.js"></script>
</body>
</html>
